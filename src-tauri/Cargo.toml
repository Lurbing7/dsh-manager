[package]
name = "dsh-manager"
version = "0.1.0"
description = "DeepSeek Harness desktop panel: update check + one-click launch"
authors = ["you"]
edition = "2021"

[lib]
# The `_lib` suffix keeps the lib name unique and avoids a conflict with the bin
# name on Windows (see https://github.com/rust-lang/cargo/issues/8519).
name = "dsh_panel_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
winreg = "0.52"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
chrono = { version = "0.4.45", features = ["serde"] }
zstd = "0.14.0"
